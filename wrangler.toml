name = "safana-connect"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "safana-connect"
database_id = "50ba7168-40e0-4ae0-a0c5-7b1edc4541ad"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "safana-media"

[[durable_objects.bindings]]
name = "HUB"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[triggers]
crons = ["* * * * *"]

[vars]
ADMIN_EMAIL = ""
CHAIRMAN_EMAIL = ""
