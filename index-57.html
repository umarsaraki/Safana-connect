"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n<1000?String(n):(n<1e6?+(n/1e3).toFixed(1)+"K":+(n/1e6).toFixed(1)+"M");
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?"just now":m<60?m+"m ago":m<1440?Math.round(m/60)+"h ago":Math.round(m/1440)+"d ago"};
const NAV=[["home","🏠","Home"],["chairman","🏛️","Mr Chairman"],["request","📄","Request"],["projects","🏗️","Projects"],["profile","👤","Profile"]];
const ME={id:"me",name:"Guest",user:"guest",bio:"",loc:"",avatar:"",followers:0,following:0};
/* Demo data store. The server API in src/worker.js replaces it step by step (see README). */
const DEF={lang:"en",theme:"system",ts:"m",va:true,ds:false,topics:[],pub:true,vp:"everyone",vf:"everyone",cm:"everyone",fl:"everyone",disc:true,pi:"me",alert:true,big:false,ra:false,hc:false,lbl:false,kb:false,blocked:[],muted:[],restricted:[]};
function loadCfg(){try{return {...DEF,...JSON.parse(localStorage.getItem("sc_cfg")||"{}")}}catch(e){return {...DEF}}}
const S={booting:location.protocol!=="file:",aterms:null,am:"login",hub:null,pend:null,draft:"",apiOn:false,user:null,sessions:null,aq:"",au:null,apq:"",ap:null,cfg:loadCfg(),ld:new Set(),cat:null,followers:[],freq:[],logins:[{t:Date.now(),d:(navigator.platform||"Device")+" · "+(/Mobi/i.test(navigator.userAgent)?"Phone":"Computer")}],sub:null,pol:null,chat:[],rk:{},open:new Set(),reply:null,role:"user",tab:"home",query:"",profileId:"me",ptab:"posts",panel:null,sec:0,
 slides:[],
 delay:5,
 users:{me:ME},
 following:new Set(),
 posts:[],
 official:[],
 saved:new Set(),
 forms:[{id:1,name:"Certificate of Indigene",fields:["Full name","Ward","Village","Father's name"]},{id:2,name:"Business Premises Permit",fields:["Full name","Business name","Business address"]},{id:3,name:"Introduction Letter",fields:["Full name","Purpose","Ward"]}],
 reqs:[],projects:[],
 meeting:null,notes:[],
 logs:[],reports:[]};
const U=id=>S.users[id]||{name:"Unknown",user:"?"};
const av=(u,z)=>`<div class="av" ${z&&u.avatar?`data-zoom="${esc(u.avatar)}" role="button" tabindex="0" aria-label="View picture"`:""}>${u.avatar?`<img alt="" src="${esc(u.avatar)}">`:esc(u.name[0])}</div>`;
const log=a=>S.logs.unshift({a,by:S.role,t:Date.now()});
function toast(m){const t=$("#toast");t.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;setTimeout(()=>t.innerHTML="",2400)}
const can=r=>S.role===r||S.role==="admin";
const notify=(txt,to="me")=>S.notes.unshift({id:Date.now()+Math.random(),txt,to,read:false,t:Date.now()});const ping=(to,txt)=>{if(to!=="me")notify(txt,to)};const mine=()=>S.notes.filter(n=>!n.to||n.to==="all"||n.to==="me"||(n.to==="chairman"&&can("chairman"))||(n.to==="admin"&&S.role==="admin"));

function nav(){const h=NAV.map(([k,i,l])=>`<button data-go="${k}" class="${S.tab===k&&!S.panel?"on":""}" ${S.tab===k&&!S.panel?'aria-current="page"':""}><span aria-hidden="true">${i}</span>${l}</button>`).join("");
 $("#navTop").innerHTML=h;$("#navBot").innerHTML=h;$("#pn").hidden=S.role==="user";
 const n=mine().filter(x=>!x.read).length;$("#nb").textContent=n?fmt(n):"";$("#nb").style.display=n?"":"none"}

function hero(){const on=S.slides.filter(s=>s.on);if(!on.length)return"";
 return `<section class="hero" aria-label="Featured"><div id="sl">${on.map((s,i)=>`<div class="slide ${i===0?"on":""}" style="${s.img?`background-image:url('${esc(s.img)}')`:""}"><h2>${esc(s.t)}</h2><p>${esc(s.d)}</p><div><button class="btn" style="background:#fff;color:var(--g7)">${esc(s.b)}</button></div></div>`).join("")}</div><div class="dots">${on.map((_,i)=>`<b data-dot="${i}" class="${i?"":"on"}"></b>`).join("")}</div></section>`}
let timer,idx=0;
function carousel(){clearInterval(timer);const sl=[...document.querySelectorAll(".slide")];if(sl.length<2)return;idx=0;
 const go=i=>{idx=i;sl.forEach((s,j)=>s.classList.toggle("on",j===i));document.querySelectorAll("[data-dot]").forEach((d,j)=>d.classList.toggle("on",j===i))};
 if(!S.cfg.ds&&!S.cfg.ra)timer=setInterval(()=>go((idx+1)%sl.length),S.delay*1000);document.querySelectorAll("[data-dot]").forEach(d=>d.onclick=()=>go(+d.dataset.dot))}

function showWho(p,k){const ids=k==="likes"?[...p.likes]:[...(p.sh||[])];const x=k==="likes"?p.base:0;
 $("#pop").innerHTML=`<div class="card pop" role="dialog" aria-label="${k}"><div class="row"><b class="sp">${k==="likes"?"Liked by":"Shared by"}</b><button class="btn sm alt" id="xw">Close</button></div>${ids.map(i=>`<div class="row" style="padding:6px 0;border-top:1px solid var(--line)">${av(U(i))}<b>${esc(U(i).name)}</b></div>`).join("")||'<div class="empty">No one yet.</div>'}${x?`<div class="mut">and ${fmt(x)} others</div>`:""}</div>`;$("#xw").onclick=()=>$("#pop").innerHTML=""}

const readImg=(f,max,cb)=>{if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>max){toast("Use a JPG, PNG or WebP image under "+max/1e6+" MB");return}const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.8))};im.onerror=()=>toast("Could not read that image");im.src=r.result};r.readAsDataURL(f)};
const STM={"Pending":"With the Local Government office for first review.","Form Ready":"Accepted. Complete the full form to send it to the Chairman.","Under Review":"With the Chairman for the final decision.","Approved":"Approved. You can download your approval.","Rejected":"This request was not approved."};
const offComposer=()=>'<textarea id="ot" rows="2" maxlength="2000" placeholder="Write an official announcement" aria-label="Announcement"></textarea><div class="row" style="margin-top:6px"><input type="file" id="of" accept="image/jpeg,image/png,image/webp" style="flex:1;width:auto" aria-label="Attach picture"><button class="btn" id="op">Publish</button></div>';
const fillForm=r=>`<div class="card" style="border-color:var(--g5)"><h3>Full form: ${esc(r.form)}</h3><p class="mut">Complete every field. This goes to the Chairman.</p><label for="xn">Full name</label><input id="xn" maxlength="80" value="${esc(ME.name)}"><label for="xa">Home address</label><input id="xa" maxlength="150"><label for="xp">Phone</label><input id="xp" type="tel" maxlength="20" value="${esc((r.data[2]||[])[1]||"")}"><label for="xd">Full details of your need</label><textarea id="xd" rows="5" maxlength="2000"></textarea><label for="xf">Supporting picture (optional)</label><input id="xf" type="file" accept="image/jpeg,image/png,image/webp"><div class="row" style="margin-top:10px"><button class="btn" id="xs">Send to Chairman</button><button class="btn alt" id="xc">Cancel</button></div></div>`;
function comments(p){return `<div class="cms">${p.cm.map((c,i)=>{if(S.cfg.restricted.includes(c.a)||S.cfg.blocked.includes(c.a))return"";const cu=U(c.a),ro=S.reply===p.id+":"+i;return `<div class="cmt">${av(cu)}<div style="flex:1;min-width:0"><div class="bub"><b>${esc(cu.name)}</b><div>${mt(c.txt)}</div></div><div class="mut" style="margin:2px 8px">${ago(c.t||p.t)} · <a href="#" data-reply="${i}">Reply</a></div>${(c.rep||[]).map(r=>{const ru=U(r.a);return `<div class="cmt">${av(ru)}<div class="bub"><b>${esc(ru.name)}</b><div>${mt(r.txt)}</div></div></div>`}).join("")}${ro?`<div class="cin"><input id="ri${p.id}" maxlength="500" value="@${esc(cu.user)} " placeholder="Reply to ${esc(cu.name)}" aria-label="Reply"><button class="btn sm" data-sendr="${i}">Send</button></div>`:""}</div></div>`}).join("")}<div class="cin">${av(ME)}<input id="ci${p.id}" maxlength="500" placeholder="Write a comment" aria-label="Write a comment"><button class="btn sm" data-sendc="1">Send</button></div></div>`}
function post(p){const u=U(p.a),n=p.base+p.likes.size,lk=p.likes.has("me"),f=S.following.has(u.id),nc=p.cm.reduce((t,c)=>t+1+(c.rep||[]).length,0),ns=p.sh?p.sh.size:0,saved=S.saved.has(p.id),own=p.a==="me",hasImg=p.img||(p.media&&p.media.some(m=>m.kind==="image")),off=p.official||S.official.includes(p),vws=S.user&&(own||S.role==="admin")&&p.views?p.views.post:0;
 const txt=p.txt?(p.bg&&BGS[p.bg]?`<div class="bgpost" style="${bgCss(p.bg)};font-size:${p.txt.length<60?32:p.txt.length<130?26:22}px">${mt(p.txt)}</div>`:`<p class="pt">${mt(p.txt)}</p>`):"";
 return `<article class="card post" data-p="${p.id}"><div class="ph"><div data-prof="${u.id}" role="link" tabindex="0" style="cursor:pointer">${av(u)}</div><div class="sp pn"><a href="#" data-prof="${u.id}" style="color:inherit;text-decoration:none"><b>${esc(u.name)}</b></a>${u.verified||off?' <span class="ver" title="Official account">✔ Official</span>':""}<div class="mut">@${esc(u.user)} · ${ago(p.t)} · 🌍</div></div>${!own&&u.id!=="me"?`<button class="fb ${f?"on":""}" data-fol="${u.id}">${f?"Following":"+ Follow"}</button>`:""}<button class="dots" data-a="menu" aria-label="More options" aria-expanded="${S.menu===p.id}">⋯</button></div>
 ${S.menu===p.id?`<div class="menu"><button data-a="save">${saved?"★ Unsave post":"☆ Save post"}</button>${hasImg?'<button data-a="dl">⬇ Download picture</button>':""}${S.user&&(own||S.role==="admin")?'<button data-a="del">🗑 Delete post</button>':""}${own?"":'<button data-a="rep">⚑ Report post</button>'}</div>`:""}
 ${txt}${(p.img||(p.media&&p.media.length))?(S.cfg.ds&&!S.ld.has(p.id)?`<button class="btn alt sm" data-ld="${p.id}" style="margin:8px 14px">Load media</button>`:mediaHtml(p)):""}
 ${n||nc||ns||vws?`<div class="pc">${n?`<a href="#" data-who="likes">👍 ${fmt(n)}</a>`:""}<span class="sp"></span>${vws?`<span>👁 ${fmt(vws)}</span> · `:""}${nc?`<span data-a="cm" role="button" tabindex="0" style="cursor:pointer">${fmt(nc)} comment${nc>1?"s":""}</span>`:""}${nc&&ns?" · ":""}${ns?`<a href="#" data-who="shares">${fmt(ns)} share${ns>1?"s":""}</a>`:""}</div>`:""}
 <div class="pa"><button class="${lk?"lk":""}" data-a="like" aria-pressed="${lk}">👍 ${lk?"Liked":"Like"}</button><button data-a="cm">💬 Comment</button><button data-a="share">↗ Share</button></div>${!S.user&&S.open.has(p.id)?`<div class="cms-w">${comments(p)}</div>`:""}</article>`}
function home(){const q=S.query.toLowerCase();
 const rk=p=>S.rk[p.id]??=(p.a==="me"&&Date.now()-p.t<3e5?-9:Math.random()-(S.following.has(p.a)?.5:0)-(S.cfg.topics.some(t=>p.txt.toLowerCase().includes(t))?.4:0));
 const list=S.posts.filter(p=>(!q||p.txt.toLowerCase().includes(q))&&!S.cfg.blocked.includes(p.a)&&!S.cfg.muted.includes(p.a)&&!(S.users[p.a]||{}).suspended).sort((a,b)=>rk(a)-rk(b));
 return `${S.newp&&S.user&&!S.single?'<button class="btn newp" data-newp="1">↑ New posts</button>':""}${S.single?`<div class="card"><button class="btn alt sm" data-single="1">← Back to feed</button></div>${post(S.single)}`:""}${q||S.single?"":hero()}${S.user&&!q&&!S.single?storyBar():""}<div class="card" style="padding:8px"><input id="hq" type="search" placeholder="Search people, usernames or posts" aria-label="Search people and posts" value="${esc(S.query)}"></div>${people(q)}${S.user?composerBar():`<div class="card"><label for="nt" class="sr" style="margin:0">Create a post</label><textarea id="nt" rows="2" maxlength="2000" placeholder="What is happening in Safana?"></textarea><div class="row" style="margin-top:8px"><input type="file" id="nf" accept="image/jpeg,image/png,image/webp" style="width:auto;flex:1" aria-label="Attach image"><button class="btn" id="np">Post</button></div></div>`}
 ${list.length?list.map(p=>post(p)).join(""):'<div class="card empty">No posts match your search. Try a different word or write the first post.</div>'}`}

function chairman(){const m=S.meeting;
 return `${m?`<div class="card" style="border-color:var(--red)"><div class="row"><span class="live">${m.live?"● LIVE":"SCHEDULED"}</span><b>${esc(m.title)}</b><span class="sp"></span>${m.live?'<button class="btn red" data-a="join">Join Live</button>':""}</div><p class="mut">${esc(m.d)} · ${esc(m.when)} · ${fmt(m.n)} participants</p>${m.live?`<div class="mut" id="chat">${m.chat.map(c=>`<div><b>${esc(c.n)}:</b> ${esc(c.t)}</div>`).join("")}</div><div class="row"><input id="ci" placeholder="Send a message" aria-label="Chat message" style="flex:1"><button class="btn sm" data-a="chat">Send</button></div>`:""}</div>`:'<div class="card empty">No live meeting right now. Scheduled meetings appear here.</div>'}
 <div class="card"><h2>Mr Chairman</h2><p class="mut">Official announcements from the Safana Local Government Chairman.</p>${can("chairman")?offComposer():""}</div>
 ${S.official.map(p=>post(p)).join("")||'<div class="card empty">No announcements yet.</div>'}`}

function request(){const mine=S.reqs.filter(r=>r.by==="me"),fr=S.reqs.find(r=>r.id===S.fillId);
 return `${fr?fillForm(fr):""}<div class="card"><h2>New request</h2><p class="mut">Tell us what you need. The Local Government office reviews it first, then sends you a full form to complete.</p><label for="fs">Type</label><select id="fs">${S.forms.map(f=>`<option>${esc(f.name)}</option>`).join("")}<option>Other</option></select><label for="ct">What do you need?</label><input id="ct" maxlength="100"><label for="cd">Description</label><textarea id="cd" rows="3" maxlength="1000"></textarea><div class="grid" style="grid-template-columns:1fr 1fr"><div><label for="cp">Phone</label><input id="cp" type="tel" maxlength="20"></div><div><label for="cw">Ward or village</label><input id="cw" maxlength="80"></div></div><label for="crf">Picture (optional)</label><input id="crf" type="file" accept="image/jpeg,image/png,image/webp"><button class="btn" id="cr" style="margin-top:10px">Send request</button></div>
 <div class="card"><h3>My requests</h3>${mine.length?mine.map(r=>`<div style="padding:10px 0;border-top:1px solid var(--line)"><div class="row"><div class="sp"><b>${esc(r.form)}</b><div class="mut">${new Date(r.t).toLocaleDateString()}</div></div><span class="tag ${r.st.replace(/ /g,"")}">${r.st}</span></div><div class="mut">${STM[r.st]}</div>${r.st==="Form Ready"?`<button class="btn sm" data-fill="${r.id}" style="margin-top:6px">Fill the full form</button>`:""}${r.st==="Approved"?`<button class="btn sm" data-dlr="${r.id}" style="margin-top:6px">Download approval</button>`:""}</div>`).join(""):'<div class="empty">No requests yet. Send your first request above.</div>'}</div>`}

function projects(){const q=(S.pq||"").toLowerCase(),f=S.pf||"All";
 const l=S.projects.filter(p=>(f==="All"||p.st===f)&&(p.title+p.loc).toLowerCase().includes(q));
 return `<div class="row"><input id="pq" placeholder="Search projects" aria-label="Search projects" style="flex:1" value="${esc(S.pq||"")}"><div class="tabs">${["All","Planned","Ongoing","Completed"].map(x=>`<button data-pf="${x}" class="${f===x?"on":""}">${x}</button>`).join("")}</div></div>
 <div class="grid">${l.map(p=>`<div class="card">${p.img?`<img class="m" alt="${esc(p.title)}" data-zoom="${esc(p.img)}" src="${esc(p.img)}" style="margin:0 0 8px">`:""}<div class="row"><b class="sp">${esc(p.title)}</b><span class="tag ${p.st}">${p.st}</span></div><p class="mut">📍 ${esc(p.loc)}<br>${esc(p.start)} to ${esc(p.end)}</p><p>${esc(p.d)}</p><div class="bar" role="progressbar" aria-valuenow="${p.pr}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p.pr}%"></i></div><div class="mut">${p.pr}% complete</div></div>`).join("")||'<div class="card empty">No projects match.</div>'}</div>`}

const VERSION="1.0.0";
const POL=[["Terms of Service","By using Safana Connect you agree to follow these terms and the Posting Rules.\nYou are responsible for what you post and for keeping your account secure.\nThe Local Government may remove content or suspend accounts that break these terms."],
["Privacy Policy","We collect only what we need to run your account: your name, username, any contact details you choose to add, your posts and your requests.\nApplicant information in form requests is visible only to you and the officials who review it.\nWe do not sell personal information."],
["Community Guidelines","Treat everyone with respect. Do not harass, threaten or insult others.\nShare true and useful information. Do not spread rumours that can cause fear or harm.\nReport posts that break these guidelines with the report button."],
["Posting Rules","Post only content you have the right to share.\nDo not post hate speech, nudity, graphic violence, scams or personal information about other people.\nImages must be JPG, PNG or WebP. Posts can have up to 2,000 characters."],
["Copyright Policy","Do not upload photos, videos or text that belong to someone else without permission.\nIf your work was posted without permission, send the platform office a link to the post and proof of ownership through Help & Support. Infringing content will be removed."],
["Prohibited Content","These are not allowed: illegal goods or services, fraud and impersonation, content that sexualises or endangers children, threats or calls for violence, and material that promotes hatred based on ethnicity, religion or gender."],
["Account Suspension and Appeals","Accounts that break the rules may be warned, restricted or suspended.\nIf your account is suspended, appeal through Help & Support within 30 days. An administrator will review your appeal and reply in the chat."],
["Data Protection and User Rights","You can view and correct your personal information in Edit Profile.\nYou can ask for a copy of your data, or for your account to be deleted, through Help & Support.\nSupport messages are deleted automatically 24 hours after they are sent."]];
const MENU=[["saved","★","Saved Posts"],["edit","✎","Edit Profile"],["settings","⚙","Settings"],["help","💬","Help & Support"],["terms","📜","Terms & Policies"],["about","ℹ","About Safana Connect"]];
const chatLive=()=>S.chat.filter(m=>Date.now()-m.t<864e5); /* display only; permanent deletion is server-side (see schema.sql) */
const bubble=m=>{const u=m.from==="user";return `<div style="display:flex;justify-content:${u?"flex-end":"flex-start"};margin-top:8px"><div class="bub" style="max-width:85%;flex:none;${u?"background:var(--g1)":""}">${m.img?`<img class="m" alt="Screenshot" data-zoom="${esc(m.img)}" src="${esc(m.img)}">`:""}${m.txt?`<div>${esc(m.txt)}</div>`:""}<div class="mut" style="font-size:12px">${new Date(m.t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})} · ${u?m.st:"Support"}</div></div></div>`};
const sec=(h,t)=>`<h3 style="margin-top:14px">${h}</h3><p>${t}</p>`;
const CATS=[["account","👤","Account Settings"],["privacy","🔒","Privacy & Audience"],["security","🛡","Security"],["prefs","🎛","Preferences"],["people","👥","Followers & Blocking"],["access","♿","Accessibility"]];
const RK={blocked:"block",muted:"mute",restricted:"restrict"};

const sid=v=>/^usr_/.test(v);
const auth=async(fn,ok)=>{if(!S.user)return toast("Log in first. This needs an account.");try{await fn();toast(ok)}catch(e){toast(e.message||"Something went wrong")}};
async function saveCfg(){try{localStorage.setItem("sc_cfg",JSON.stringify(S.cfg))}catch(e){}if(S.user)try{await api("PUT","/settings",{settings:S.cfg})}catch(e){}}
async function rel(k,v,add){if(!S.user||!sid(v))return;try{await api("POST","/relations",{kind:RK[k],target:v,add})}catch(e){toast("Could not save to the server")}}
function applyCfg(){const c=S.cfg,d=document.documentElement,b=document.body,dark=c.theme==="dark"||(c.theme==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);
 d.dataset.theme=dark?"dark":"light";d.lang=c.lang;{const z=({s:.9,m:1,l:1.15}[c.ts]||1)*(c.big?1.2:1);b.style.zoom=z===1?"":z}b.classList.toggle("ra",c.ra);b.classList.toggle("hc",c.hc);b.classList.toggle("lbl",c.lbl);b.classList.toggle("kb",c.kb)}
async function doLogout(){try{if(S.user)await api("POST","/logout")}catch(err){return toast("Could not log out. Try again.")}if(S.apiOn){try{localStorage.removeItem("sc_state_v2");localStorage.removeItem("sc_state_v1");localStorage.removeItem("sc_cfg");sessionStorage.removeItem("sc_view")}catch(e){}location.replace(location.pathname);return}S.user=null;S.am="login";S.posts=[];S.official=[];S.reqs=[];S.notes=[];S.projects=[];S.slides=[];S.stories=[];S.savedPosts=[];S.saved=new Set();S.following=new Set();if(ws){const w=ws;ws=null;w.close()}HC.convs=[];HC.pub=[];HC.msgs={};HC.up=0;S.role="user";S.tab="home";S.panel=null;S.sub=null;S.cat=null;S.hub=null;S.rk={};history.replaceState(null,"",location.pathname);if(!S.apiOn)syncDemo();badge();render();scrollTo(0,0);toast("You have been logged out")}
function blockUser(v){if(!S.cfg.blocked.includes(v))S.cfg.blocked.push(v);S.following.delete(v);S.followers=S.followers.filter(x=>x!==v);S.freq=S.freq.filter(x=>x!==v);rel("blocked",v,true);saveCfg()}

function artSvg(){const sk=["#8d5524","#a0673a","#6b4423","#c68642","#7a4a2b"],rb=["#ffffff","#bfe3f5","#e8c27a","#f4a7b9","#c9a0dc","#ffb86b","#9fd8b6","#e9e9e9"],cp=["#c0392b","#f5f5f5","#2c3e50","#d4a017","#1e8449","#7d3c98"];
 const man=(x,y,k,i)=>`<g transform="translate(${x} ${y}) scale(${k})"><path d="M-19 0Q-17-30-9-36H9Q17-30 19 0Z" fill="${rb[i%8]}"/><circle cy="-45" r="9" fill="${sk[i%5]}"/><path d="M-9.5-47Q0-60 9.5-47Z" fill="${cp[i%6]}"/></g>`;
 const wom=(x,y,k,i)=>`<g transform="translate(${x} ${y}) scale(${k})"><path d="M-19 0Q-18-28-10-34H10Q18-28 19 0Z" fill="${rb[(i+3)%8]}"/><path d="M-13-36Q-15-62 0-62Q15-62 13-36Q0-30-13-36Z" fill="${rb[(i+5)%8]}"/><ellipse cy="-47" rx="6.5" ry="8" fill="${sk[(i+2)%5]}"/></g>`;
 let g="";for(let x=14,i=0;x<400;x+=34,i++)g+=`<g opacity=".8">${(i%3===1?wom:man)(x,200,.62,i+1)}</g>`;
 [[44,222,.92,2],[76,226,.95,3],[108,220,.9,4],[292,220,.9,5],[324,226,.95,6],[356,222,.92,7],[150,228,1,8],[250,228,1,9],[176,233,1.05,10],[224,233,1.05,11]].forEach(([x,y,k,i])=>g+=(i%3===0?wom:man)(x,y,k,i));
 g+=`<ellipse cx="200" cy="240" rx="34" ry="5" fill="#000" opacity=".25"/>${man(200,238,1.5,0)}<path d="M189 187L213 232" stroke="#d4a017" stroke-width="6" stroke-linecap="round"/>`;
 return `<svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#073b27"/><stop offset=".7" stop-color="#1f8a5b"/><stop offset="1" stop-color="#8fd3a8"/></linearGradient></defs><rect width="400" height="260" fill="url(#sky)"/><circle cx="330" cy="70" r="30" fill="#f6e7a1" opacity=".55"/><path d="M0 215V162h38v-10h10v10h30v-18h14v18h30V158h12v57zM250 215v-52h28v-12h8v12h22v-26h12v26h20v-10h10v10h50v52z" fill="#0a4a30" opacity=".85"/><rect y="212" width="400" height="48" fill="#0d3d28"/>${g}</svg>`}

function syncDemo(){const d=D();HC.room=d.room;HC.pub=d.pub;HC.logs=d.logs;HC.pubUnread=d.pub.filter(m=>m.from!=="me"&&m.id>d.pr).length;
 HC.convs=d.convs.map(c=>{const l=c.msgs[c.msgs.length-1];return{id:c.id,other:c.other,last:l||null,unread:c.msgs.filter(m=>m.from!=="me"&&m.id>c.read).length,iBlocked:c.blocked,theyBlocked:false}});

/* Server loading */
async function loadState(){const d=await api("GET","/chat/state");HC.room=d.room;HC.pubUnread=d.pubUnread;HC.up=d.privUnread;HC.logs=d.logs||[]}
async function loadConvs(){const d=await api("GET","/chat/conversations");HC.convs=d.conversations.map(c=>{hubUser(c.other);return{id:String(c.id),other:c.other.id,last:c.last,unread:c.unread,iBlocked:c.iBlocked,theyBlocked:c.theyBlocked}});HC.up=privUnread()}
async function hubLoad(){HC.err="";HC.busy=true;render();try{if(S.user)await Promise.all([loadState(),loadConvs()]);else syncDemo()}catch(e){HC.err=e.message}HC.busy=false;badge();render()}
async function openHub(){S.panel=null;S.hub={v:"list"};render();scrollTo(0,0);if(S.apiOn&&!S.user)return;await hubLoad()}
async function hgo(v,id){S.hub={v,id};S.draft="";S.pend=null;render();
 try{if(S.user){if(v==="public")HC.pub=(await api("GET","/chat/public")).messages.map(nm);else{const d=await api("GET","/chat/conversations/"+id+"/messages");HC.msgs[id]=d.messages.map(nm);HC.otherRead[id]=d.otherRead||0}}}catch(e){HC.err=e.message}
 await markRead();render();toBottom()}
async function markRead(){const h=S.hub;if(!h)return;try{
 if(h.v==="public"){if(S.user)await api("POST","/chat/public/read");else D().pr=Math.max(0,...D().pub.map(m=>m.id));HC.pubUnread=0}
 else if(h.v==="conv"){if(S.user){const d=await api("POST","/chat/conversations/"+h.id+"/read");HC.up=d.privUnread}else{const c=D().convs.find(x=>x.id===h.id);if(c)c.read=Math.max(0,...c.msgs.map(m=>m.id))}const c=HC.convs.find(x=>x.id===h.id);if(c)c.unread=0}
 if(!S.user)syncDemo()}catch(e){}badge()}
function connectWS(){if(!S.user||ws)return;try{const w=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/api/ws");ws=w;w.onmessage=ev=>{try{onEvt(JSON.parse(ev.data))}catch(e){}};w.onclose=()=>{if(ws===w)ws=null;if(S.user)setTimeout(connectWS,3000)}}catch(e){}}
function onEvt(e){const v=S.hub;
 if(e.t==="pub"){const m=nm(e.msg);if(!HC.pub.some(x=>x.id===m.id))HC.pub.push(m);if(v&&v.v==="public")markRead();else if(m.from!==myId())HC.pubUnread++}
 else if(e.t==="priv"){const m=nm(e.msg),id=String(e.conv),c=HC.convs.find(x=>x.id===id);if(!c){loadConvs().then(()=>{badge();if(S.hub)render()});return}
  const a=HC.msgs[id]||(HC.msgs[id]=[]);if(!a.some(x=>x.id===m.id))a.push(m);c.last={body:m.body,media:!!m.media,t:m.t};
  if(m.from!==myId()){if(v&&v.v==="conv"&&v.id===id)markRead();else{c.unread++;HC.up++}}}
 else if(e.t==="read"){HC.otherRead[String(e.conv)]=e.upTo}else if(e.t==="note"){refreshNotes()}else if(e.t==="pu"){if(allP().some(p=>p.id===e.id))refreshPost(e.id)}else if(e.t==="np"){if(!S.single){S.newp=true;if(S.tab==="home"&&!S.hub&&!S.panel)render()}}else if(e.t==="room"){HC.room=e.room;toast(e.room.locked?"Public chat locked":"Public chat unlocked")}
 badge();if(S.hub){render();toBottom()}}
async function hubSend(){const inp=$("#mi");if(!inp||inp.disabled)return;const t=inp.value.trim(),img=S.pend,h=S.hub;if(!t&&!img)return;
 try{if(S.user){let key="";if(img)key=(await upload(img,h.v==="public"?"public":"private",h.id)).key;
   const m=nm((await api("POST",h.v==="public"?"/chat/public":"/chat/conversations/"+h.id+"/messages",{body:t,media:key})).message);
   if(h.v==="public"){if(!HC.pub.some(x=>x.id===m.id))HC.pub.push(m)}else{const a=HC.msgs[h.id]||(HC.msgs[h.id]=[]);if(!a.some(x=>x.id===m.id))a.push(m);const c=HC.convs.find(x=>x.id===h.id);if(c)c.last={body:m.body,media:!!m.media,t:m.t}}}
  else{const d=D(),m={id:d.nid++,from:"me",body:t,media:img||"",t:Date.now()};
   if(h.v==="public"){if(d.room.locked&&!isStaff())throw new Error("Chat is locked");d.pub.push(m);d.pr=m.id}else{const c=d.convs.find(x=>x.id===h.id);if(c.blocked)throw new Error("Unblock this person to send messages");c.msgs.push(m);c.read=m.id}syncDemo()}
  S.draft="";S.pend=null;render();toBottom()}catch(e){toast(e.message)}}
async function hubLock(lock){const reason=lock?((await askText("Reason for locking (optional)"))||"").slice(0,200):"";if(!await askConfirm(lock?"Lock the public chat? Ordinary users will not be able to send messages.":"Unlock the public chat?",lock?"Lock":"Unlock"))return;
 try{if(S.user){HC.room=(await api("POST","/chat/room",{locked:lock,reason})).room;await loadState()}else{const d=D();d.room={locked:lock,by:ME.name,at:Date.now(),reason};d.logs.unshift({action:lock?"lock":"unlock",by:ME.name,reason,t:Date.now()});syncDemo()}render()}catch(e){toast(e.message)}}
async function hubBlock(oid){const c=HC.convs.find(x=>x.other===oid);if(!c)return;const nb=!c.iBlocked;if(nb&&!await askConfirm("Block this person? They will not be able to message you.","Block",true))return;

const SKEY="sc_state_v2",PK=["users","posts","official","reqs","notes","chat","projects","slides","delay","meeting","logs","reports","followers","freq","following","saved","demoChat"];
function persist(){if(S.apiOn)return;try{const o={};PK.forEach(k=>o[k]=S[k]);localStorage.setItem(SKEY,JSON.stringify(o,(k,v)=>v instanceof Set?{__set:[...v]}:v))}catch(e){if(!S.warned){S.warned=1;toast("Storage is full. Some pictures may not be saved.")}}}
