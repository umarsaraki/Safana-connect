<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Safana Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g9:#073b27;--g7:#0b5d3b;--g5:#1f8a5b;--g1:#e6f3ec;--bg:#f3f6f4;--card:#fff;--ink:#14231c;--mut:#5d6f65;--line:#dbe5df;--red:#b3261e;--gold:#c9a227;--r:14px}
*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden;overscroll-behavior-y:none}main,.card,.grid>*{min-width:0}img{max-width:100%}.mut a{color:inherit}.off{border:2px solid var(--g5);background:#f4fbf7}.big .av{width:84px;height:84px;font-size:30px;border:4px solid #fff}.card img.m{width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-top:8px}
body{font:16px/1.5 'Hanken Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.2}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--g7);color:#fff;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font:700 20px Fraunces,serif;white-space:nowrap}
.logo i{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--g7);display:grid;place-items:center;font-style:normal;font-size:18px}
.top input{flex:1;min-width:0;border:0;border-radius:99px;padding:9px 16px;background:rgba(255,255,255,.16);color:#fff}
.top input::placeholder{color:#d5eadf}
.ib{background:none;border:0;color:#fff;font-size:20px;position:relative;padding:6px 8px;border-radius:8px}
.badge{position:absolute;top:0;right:0;background:var(--red);font-size:11px;border-radius:99px;padding:0 5px;min-width:17px;text-align:center}
nav.main{display:none}
nav.bot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav button{flex:1;background:none;border:0;padding:8px 2px;color:var(--mut);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;border-top:3px solid transparent}
nav button span{font-size:20px}
nav button.on{color:var(--g7);border-top-color:var(--g7);font-weight:700}
main{max-width:1060px;margin:0 auto;padding:14px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.btn{background:var(--g7);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:700}
.btn.alt{background:var(--g1);color:var(--g7)}.btn.red{background:var(--red)}.btn.sm{padding:5px 10px;font-size:14px}
.btn:disabled{opacity:.5}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;color:var(--ink)}
label{display:block;font-weight:700;font-size:14px;margin:8px 0 3px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.mut{color:var(--mut);font-size:14px}
.av{width:42px;height:42px;border-radius:50%;background:var(--g5);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.ver{color:var(--g5);font-size:14px}
.hero{position:relative;border-radius:var(--r);overflow:hidden;min-height:210px;background:var(--g9);color:#fff}
.slide{position:absolute;inset:0;padding:26px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;opacity:0;transition:opacity .6s;background-size:cover;background-position:center}
.slide.on{opacity:1}.slide::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(7,59,39,.92),rgba(7,59,39,.2))}
.slide>*{position:relative;max-width:560px}.slide h2{font-size:28px}
.dots{position:absolute;right:14px;bottom:12px;display:flex;gap:6px;z-index:2}
.dots b{width:9px;height:9px;border-radius:50%;background:#ffffff66;cursor:pointer}.dots b.on{background:#fff}
.post .act{display:flex;gap:4px;border-top:1px solid var(--line);margin-top:10px;padding-top:6px;flex-wrap:wrap}
.post .act button{background:none;border:0;padding:6px 10px;border-radius:8px;color:var(--mut)}
.post .act button:hover{background:var(--g1)}.post .act .lk{color:var(--g7);font-weight:700}
.post img.m{width:100%;max-height:420px;object-fit:cover;border-radius:10px;margin-top:8px}
.live{background:var(--red);color:#fff;border-radius:6px;padding:1px 8px;font-weight:700;font-size:13px;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.55}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.bar{height:8px;background:var(--g1);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g5)}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--g1);color:var(--g7)}
.tag.Rejected{background:#fbe3e1;color:var(--red)}.tag.Pending,.tag.Planned{background:#fdf3d0;color:#7a5d00}
.cover{height:130px;border-radius:var(--r) var(--r) 0 0;background:linear-gradient(120deg,var(--g9),var(--g5));margin:-14px -14px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px}.tabs button.on{background:var(--g7);color:#fff}
.pop{position:fixed;top:56px;right:10px;width:min(340px,94vw);z-index:30;max-height:70vh;overflow:auto;box-shadow:0 10px 30px #0003}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--g9);color:#fff;padding:10px 18px;border-radius:10px;z-index:50}
.lb{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:60;padding:14px}.lb img{max-width:100%;max-height:92vh;border-radius:10px}[data-zoom]{cursor:zoom-in}p{overflow-wrap:anywhere}.cmt{display:flex;gap:8px;margin-top:10px}.cmt .av,.cin .av{width:32px;height:32px;font-size:13px}.bub{background:var(--bg);border-radius:14px;padding:6px 12px;flex:1;min-width:0;overflow-wrap:anywhere}.cin{display:flex;gap:6px;margin-top:10px;align-items:center}.cin input{border-radius:99px}.fb{background:none;border:1px solid var(--g7);color:var(--g7);border-radius:99px;padding:3px 12px;font-weight:700;font-size:13px}.fb.on{background:var(--g1);border-color:transparent}.tag.FormReady,.tag.UnderReview{background:#dcecff;color:#1b4f9c}.mi{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:15px 16px;text-align:left;font-size:16px;color:var(--ink)}.mi:last-child{border:0}.mi:hover{background:var(--g1)}details{border-top:1px solid var(--line);padding:8px 0}summary{font-weight:700;cursor:pointer}.lblx{display:none}.lbl .lblx{display:inline}.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;z-index:99;background:#fff;color:#000;padding:8px}.ra *{animation:none!important;transition:none!important}.kb :focus-visible{outline:4px solid #000;outline-offset:3px;box-shadow:0 0 0 7px #ffd400}.hc{--ink:#000;--mut:#1a1a1a;--line:#000;--g1:#d7efe2}.hc .card{border:2px solid #000}.hc .btn.alt{border:2px solid var(--g7)}[data-theme=dark]{--bg:#0e1713;--card:#16221c;--ink:#e8f1ec;--mut:#a3b8ac;--line:#2a3b32;--g1:#1d3228}[data-theme=dark] input,[data-theme=dark] select,[data-theme=dark] textarea,[data-theme=dark] nav.main,[data-theme=dark] nav.bot,[data-theme=dark] .tabs button{background:var(--card);color:var(--ink)}[data-theme=dark] .btn.alt,[data-theme=dark] .fb{color:#8fe0b4}[data-theme=dark] .off{background:#13261c}.lgi{background:none;border:0;padding:0;margin:0;position:relative;display:grid;border-radius:50%}.lgi .badge{top:-6px;right:-8px;border:2px solid var(--g7);font-size:12px;font-weight:700;min-width:20px}.hub{display:grid;gap:14px;grid-template-columns:1fr}.hl,.hv{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.hv{display:flex;flex-direction:column;min-height:60vh}.ml{flex:1;overflow-y:auto;padding:8px 12px;max-height:60vh;min-height:260px}.hub.vl .hv{display:none}.hub.vc .hl{display:none}.mg{display:flex;gap:8px;margin:10px 0}.mg.me{flex-direction:row-reverse}.mg .bub{max-width:80%;flex:none}.mg.me .bub{background:var(--g1)}.cnt{background:var(--red);color:#fff;border-radius:99px;font-size:12px;font-weight:700;padding:0 7px;min-width:20px;text-align:center}@media(min-width:800px){.hub{grid-template-columns:330px 1fr}.hub.vl .hv,.hub.vc .hl{display:flex}.hub.vc .hl,.hub.vl .hl{display:block}}@media(max-width:799px){.hub.vc .hv{position:fixed;inset:0;z-index:40;border-radius:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}.hub.vc .ml{max-height:none}}body.auth .top,body.auth nav.main,body.auth nav.bot{display:none}body.auth{padding-bottom:0}body.auth main{max-width:none;padding:0;gap:0;display:block}.mark{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--g7);display:grid;place-items:center;font-size:22px}.au{min-height:100vh;display:grid;grid-template-rows:auto 1fr;background:var(--g9)}.au .art{position:relative;height:44vh;min-height:300px;overflow:hidden}.au .art svg{width:100%;height:100%;display:block}.brand{position:absolute;left:18px;top:calc(18px + env(safe-area-inset-top,0px));color:#fff;display:flex;flex-direction:column;gap:6px}.brand h1{font-size:30px;text-shadow:0 2px 10px #0006}.brand p{margin:0;color:#e6f3ec;max-width:260px;font-size:15px}.au .box{background:var(--card);border-radius:24px 24px 0 0;margin-top:-24px;position:relative;padding:22px 18px calc(28px + env(safe-area-inset-bottom,0px))}.au .box>*{max-width:440px;width:100%;margin-left:auto;margin-right:auto;text-align:left}.au .box>div[style*="center"]{text-align:center}.au .box>.btn{text-align:center}.pw{position:relative}.pw input{padding-right:48px}.pw button{position:absolute;right:4px;top:4px;height:34px;width:40px;border:0;background:none;font-size:18px}.aerr{color:var(--red);font-weight:700;font-size:14px;min-height:20px;margin:8px 0 2px}.lk{background:none;border:0;color:var(--g7);font-weight:700;text-decoration:underline;padding:8px}label a{color:var(--g7)}@media(min-width:800px){.au{grid-template-columns:1.1fr 1fr;grid-template-rows:none}.au .art{height:auto;min-height:100vh}.au .box{margin:0;border-radius:0;display:flex;flex-direction:column;justify-content:center;padding:40px 6vw}}.empty{text-align:center;padding:30px;color:var(--mut)}
.role{font-size:12px;background:#ffffff26;color:#fff;border:0;border-radius:8px;padding:5px;width:auto}.role option{color:#000}
@media(min-width:800px){
 body{padding-bottom:0}nav.bot{display:none}
 nav.main{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);justify-content:center;position:sticky;top:51px;z-index:19}
 nav.main button{flex:none;flex-direction:row;padding:12px 22px;font-size:15px;gap:8px;border-top:0;border-bottom:3px solid transparent}
 nav.main button.on{border-bottom-color:var(--g7)}
 main.two{grid-template-columns:230px 1fr}.hero{min-height:280px}
}
@media(max-width:799px){.grid{grid-template-columns:1fr}.side{display:none}.top input{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<!-- Configuration: leave blank for demo mode. Anon key only. NEVER put the service-role key here. -->
<script>window.CONFIG={LIVEKIT_URL:"",CONTACT_EMAIL:"",CONTACT_PHONE:"",CONTACT_ADDRESS:""};</script>
<a class="skip" href="#app">Skip to content</a>
<header class="top">
 <div class="logo"><button class="lgi" id="lg" aria-label="Open Chat Hub"><i aria-hidden="true">✦</i><span class="badge" id="cb" style="display:none"></span></button>Safana Connect</div>
 <input id="q" type="search" placeholder="Search public posts" aria-label="Search public posts">
 <span class="sp"></span>
 <button class="role" id="pn" hidden>Panel</button>
 <button class="ib" id="bell" aria-label="Notifications">🔔<span class="lblx"> Alerts</span><span class="badge" id="nb"></span></button>
</header>
<nav class="main" id="navTop" aria-label="Primary"></nav>
<main id="app"></main>
<nav class="bot" id="navBot" aria-label="Primary"></nav>
<div id="pop"></div><div id="lb"></div><div id="toast"></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n<1000?String(n):(n<1e6?+(n/1e3).toFixed(1)+"K":+(n/1e6).toFixed(1)+"M");
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?"just now":m<60?m+"m ago":m<1440?Math.round(m/60)+"h ago":Math.round(m/1440)+"d ago"};
const NAV=[["home","🏠","Home"],["chairman","🏛️","Mr Chairman"],["request","📄","Request"],["projects","🏗️","Projects"],["profile","👤","Profile"]];
const ME={id:"me",name:"Guest",user:"guest",bio:"",loc:"",avatar:"",followers:0,following:0};
/* Demo data store. The server API in src/worker.js replaces it step by step (see README). */
const DEF={lang:"en",theme:"system",ts:"m",va:true,ds:false,topics:[],pub:true,vp:"everyone",vf:"everyone",cm:"everyone",fl:"everyone",disc:true,pi:"me",alert:true,big:false,ra:false,hc:false,lbl:false,kb:false,blocked:[],muted:[],restricted:[]};
function loadCfg(){try{return {...DEF,...JSON.parse(localStorage.getItem("sc_cfg")||"{}")}}catch(e){return {...DEF}}}
const S={booting:location.protocol!=="file:",aterms:null,am:"login",hub:null,pend:null,draft:"",apiOn:false,user:null,sessions:null,aq:"",au:null,apq:"",ap:null,cfg:loadCfg(),ld:new Set(),cat:null,followers:[],freq:[],logins:[{t:Date.now(),d:(navigator.platform||"Device")+" · "+(/Mobi/i.test(navigator.userAgent)?"Phone":"Computer")}],sub:null,pol:null,chat:[],rk:{},open:new Set(),reply:null,role:"user",tab:"home",query:"",profileId:"me",ptab:"posts",panel:null,sec:0,
 slides:[],
 delay:5,
 users:{me:ME},
 following:new Set(),
 posts:[],
 official:[],
 saved:new Set(),
 forms:[{id:1,name:"Certificate of Indigene",fields:["Full name","Ward","Village","Father's name"]},{id:2,name:"Business Premises Permit",fields:["Full name","Business name","Business address"]},{id:3,name:"Introduction Letter",fields:["Full name","Purpose","Ward"]}],
 reqs:[],projects:[],
 meeting:null,notes:[],
 logs:[],reports:[]};
const U=id=>S.users[id]||{name:"Unknown",user:"?"};
const av=(u,z)=>`<div class="av" ${z&&u.avatar?`data-zoom="${esc(u.avatar)}" role="button" tabindex="0" aria-label="View picture"`:""}>${u.avatar?`<img alt="" src="${esc(u.avatar)}">`:esc(u.name[0])}</div>`;
const log=a=>S.logs.unshift({a,by:S.role,t:Date.now()});
function toast(m){const t=$("#toast");t.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;setTimeout(()=>t.innerHTML="",2400)}
const can=r=>S.role===r||S.role==="admin";
const notify=(txt,to="me")=>S.notes.unshift({id:Date.now()+Math.random(),txt,to,read:false,t:Date.now()});const ping=(to,txt)=>{if(to!=="me")notify(txt,to)};const mine=()=>S.notes.filter(n=>!n.to||n.to==="all"||n.to==="me"||(n.to==="chairman"&&can("chairman"))||(n.to==="admin"&&S.role==="admin"));

function nav(){const h=NAV.map(([k,i,l])=>`<button data-go="${k}" class="${S.tab===k&&!S.panel?"on":""}" ${S.tab===k&&!S.panel?'aria-current="page"':""}><span aria-hidden="true">${i}</span>${l}</button>`).join("");
 $("#navTop").innerHTML=h;$("#navBot").innerHTML=h;$("#pn").hidden=S.role==="user";
 const n=mine().filter(x=>!x.read).length;$("#nb").textContent=n?fmt(n):"";$("#nb").style.display=n?"":"none"}

function hero(){const on=S.slides.filter(s=>s.on);if(!on.length)return"";
 return `<section class="hero" aria-label="Featured"><div id="sl">${on.map((s,i)=>`<div class="slide ${i===0?"on":""}" style="${s.img?`background-image:url('${esc(s.img)}')`:""}"><h2>${esc(s.t)}</h2><p>${esc(s.d)}</p><div><button class="btn" style="background:#fff;color:var(--g7)">${esc(s.b)}</button></div></div>`).join("")}</div><div class="dots">${on.map((_,i)=>`<b data-dot="${i}" class="${i?"":"on"}"></b>`).join("")}</div></section>`}
let timer,idx=0;
function carousel(){clearInterval(timer);const sl=[...document.querySelectorAll(".slide")];if(sl.length<2)return;idx=0;
 const go=i=>{idx=i;sl.forEach((s,j)=>s.classList.toggle("on",j===i));document.querySelectorAll("[data-dot]").forEach((d,j)=>d.classList.toggle("on",j===i))};
 if(!S.cfg.ds&&!S.cfg.ra)timer=setInterval(()=>go((idx+1)%sl.length),S.delay*1000);document.querySelectorAll("[data-dot]").forEach(d=>d.onclick=()=>go(+d.dataset.dot))}

function showWho(p,k){const ids=k==="likes"?[...p.likes]:[...(p.sh||[])];const x=k==="likes"?p.base:0;
 $("#pop").innerHTML=`<div class="card pop" role="dialog" aria-label="${k}"><div class="row"><b class="sp">${k==="likes"?"Liked by":"Shared by"}</b><button class="btn sm alt" id="xw">Close</button></div>${ids.map(i=>`<div class="row" style="padding:6px 0;border-top:1px solid var(--line)">${av(U(i))}<b>${esc(U(i).name)}</b></div>`).join("")||'<div class="empty">No one yet.</div>'}${x?`<div class="mut">and ${fmt(x)} others</div>`:""}</div>`;$("#xw").onclick=()=>$("#pop").innerHTML=""}

const readImg=(f,max,cb)=>{if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>max){toast("Use a JPG, PNG or WebP image under "+max/1e6+" MB");return}const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.8))};im.onerror=()=>toast("Could not read that image");im.src=r.result};r.readAsDataURL(f)};
const STM={"Pending":"With the Local Government office for first review.","Form Ready":"Accepted. Complete the full form to send it to the Chairman.","Under Review":"With the Chairman for the final decision.","Approved":"Approved. You can download your approval.","Rejected":"This request was not approved."};
const offComposer=()=>'<textarea id="ot" rows="2" maxlength="2000" placeholder="Write an official announcement" aria-label="Announcement"></textarea><div class="row" style="margin-top:6px"><input type="file" id="of" accept="image/jpeg,image/png,image/webp" style="flex:1;width:auto" aria-label="Attach picture"><button class="btn" id="op">Publish</button></div>';
const fillForm=r=>`<div class="card" style="border-color:var(--g5)"><h3>Full form: ${esc(r.form)}</h3><p class="mut">Complete every field. This goes to the Chairman.</p><label for="xn">Full name</label><input id="xn" maxlength="80" value="${esc(ME.name)}"><label for="xa">Home address</label><input id="xa" maxlength="150"><label for="xp">Phone</label><input id="xp" type="tel" maxlength="20" value="${esc((r.data[2]||[])[1]||"")}"><label for="xd">Full details of your need</label><textarea id="xd" rows="5" maxlength="2000"></textarea><label for="xf">Supporting picture (optional)</label><input id="xf" type="file" accept="image/jpeg,image/png,image/webp"><div class="row" style="margin-top:10px"><button class="btn" id="xs">Send to Chairman</button><button class="btn alt" id="xc">Cancel</button></div></div>`;
function comments(p){return `<div class="cms">${p.cm.map((c,i)=>{if(S.cfg.restricted.includes(c.a)||S.cfg.blocked.includes(c.a))return"";const cu=U(c.a),ro=S.reply===p.id+":"+i;return `<div class="cmt">${av(cu)}<div style="flex:1;min-width:0"><div class="bub"><b>${esc(cu.name)}</b><div>${mt(c.txt)}</div></div><div class="mut" style="margin:2px 8px">${ago(c.t||p.t)} · <a href="#" data-reply="${i}">Reply</a></div>${(c.rep||[]).map(r=>{const ru=U(r.a);return `<div class="cmt">${av(ru)}<div class="bub"><b>${esc(ru.name)}</b><div>${mt(r.txt)}</div></div></div>`}).join("")}${ro?`<div class="cin"><input id="ri${p.id}" maxlength="500" value="@${esc(cu.user)} " placeholder="Reply to ${esc(cu.name)}" aria-label="Reply"><button class="btn sm" data-sendr="${i}">Send</button></div>`:""}</div></div>`}).join("")}<div class="cin">${av(ME)}<input id="ci${p.id}" maxlength="500" placeholder="Write a comment" aria-label="Write a comment"><button class="btn sm" data-sendc="1">Send</button></div></div>`}
function post(p){const u=U(p.a),n=p.base+p.likes.size,lk=p.likes.has("me"),f=S.following.has(u.id),nc=p.cm.reduce((t,c)=>t+1+(c.rep||[]).length,0);

 const rk=p=>S.rk[p.id]??=(p.a==="me"&&Date.now()-p.t<3e5?-9:Math.random()-(S.following.has(p.a)?.5:0)-(S.cfg.topics.some(t=>p.txt.toLowerCase().includes(t))?.4:0));

async function boot(){if(location.protocol==="file:")return;try{const r=await fetch("/api/me",{credentials:"same-origin"});if(!(r.headers.get("content-type")||"").includes("json")){S.booting=false;render();return}S.apiOn=true;if(r.ok){const d=await r.json();setUser(d.user);HC.up=d.unread.private}}catch(e){}S.booting=false;if(S.apiOn){HC.convs=[];HC.pub=[]}badge();render()}
async function afterAuth(u){setUser(u);try{const d=await api("GET","/me");setUser(d.user);HC.up=d.unread.private}catch(e){}badge();toast("Welcome, "+u.name);S.hub=null;S.tab="home";S.rk={};render()}
const pwf=(id,ph,ac)=>`<div class="pw"><input id="${id}" type="password" maxlength="72" autocomplete="${ac}" placeholder="${ph}"><button type="button" data-eye="${id}" aria-label="Show or hide password">👁</button></div>`;
const authCard=()=>{const reg=S.am==="register";return `<h2 style="margin-bottom:4px">${reg?"Create your account":"Welcome back"}</h2><p class="mut" style="margin:0 0 12px">${reg?"Join the Safana community.":"Log in to continue."}</p>
${reg?`<label for="rn">Full name</label><input id="rn" maxlength="60" autocomplete="name" placeholder="e.g. Aisha Bello"><label for="ru">Username</label><input id="ru" maxlength="30" autocomplete="username" autocapitalize="none" placeholder="letters, numbers, underscore"><label for="re">Email</label><input id="re" type="email" maxlength="120" autocomplete="email" placeholder="name@example.com"><label for="rph">Phone number</label><input id="rph" type="tel" maxlength="16" autocomplete="tel" placeholder="08012345678"><label for="rp">Password</label>${pwf("rp","At least 8 characters","new-password")}<label class="row" style="font-weight:500;margin:14px 0 0;align-items:flex-start;flex-wrap:nowrap"><input id="rag" type="checkbox" style="width:22px;height:22px;flex:none;margin-top:2px"><span>I agree to the <a href="#" data-terms="0">Terms of Service</a> and <a href="#" data-terms="1">Privacy Policy</a></span></label>`
:`<label for="lu">Phone, email or username</label><input id="lu" maxlength="120" autocomplete="username" autocapitalize="none"><label for="lp">Password</label>${pwf("lp","Your password","current-password")}`}
<div id="aerr" class="aerr" role="alert"></div><button class="btn" id="${reg?"rg":"li"}" style="width:100%;padding:12px">${reg?"Create account":"Log in"}</button>
<div style="text-align:center;margin-top:10px">${reg?'<button class="lk" data-am="login">I already have an account</button>':'<button class="lk" data-am="register">I don\'t have an account</button>'}</div>`};
function artSvg(){const sk=["#8d5524","#a0673a","#6b4423","#c68642","#7a4a2b"],rb=["#ffffff","#bfe3f5","#e8c27a","#f4a7b9","#c9a0dc","#ffb86b","#9fd8b6","#e9e9e9"],cp=["#c0392b","#f5f5f5","#2c3e50","#d4a017","#1e8449","#7d3c98"];
 const man=(x,y,k,i)=>`<g transform="translate(${x} ${y}) scale(${k})"><path d="M-19 0Q-17-30-9-36H9Q17-30 19 0Z" fill="${rb[i%8]}"/><circle cy="-45" r="9" fill="${sk[i%5]}"/><path d="M-9.5-47Q0-60 9.5-47Z" fill="${cp[i%6]}"/></g>`;
 const wom=(x,y,k,i)=>`<g transform="translate(${x} ${y}) scale(${k})"><path d="M-19 0Q-18-28-10-34H10Q18-28 19 0Z" fill="${rb[(i+3)%8]}"/><path d="M-13-36Q-15-62 0-62Q15-62 13-36Q0-30-13-36Z" fill="${rb[(i+5)%8]}"/><ellipse cy="-47" rx="6.5" ry="8" fill="${sk[(i+2)%5]}"/></g>`;
 let g="";for(let x=14,i=0;x<400;x+=34,i++)g+=`<g opacity=".8">${(i%3===1?wom:man)(x,200,.62,i+1)}</g>`;
 [[44,222,.92,2],[76,226,.95,3],[108,220,.9,4],[292,220,.9,5],[324,226,.95,6],[356,222,.92,7],[150,228,1,8],[250,228,1,9],[176,233,1.05,10],[224,233,1.05,11]].forEach(([x,y,k,i])=>g+=(i%3===0?wom:man)(x,y,k,i));
 g+=`<ellipse cx="200" cy="240" rx="34" ry="5" fill="#000" opacity=".25"/>${man(200,238,1.5,0)}<path d="M189 187L213 232" stroke="#d4a017" stroke-width="6" stroke-linecap="round"/>`;
 return `<svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#073b27"/><stop offset=".7" stop-color="#1f8a5b"/><stop offset="1" stop-color="#8fd3a8"/></linearGradient></defs><rect width="400" height="260" fill="url(#sky)"/><circle cx="330" cy="70" r="30" fill="#f6e7a1" opacity=".55"/><path d="M0 215V162h38v-10h10v10h30v-18h14v18h30V158h12v57zM250 215v-52h28v-12h8v12h22v-26h12v26h20v-10h10v10h50v52z" fill="#0a4a30" opacity=".85"/><rect y="212" width="400" height="48" fill="#0d3d28"/>${g}</svg>`}
function authPage(){if(S.aterms!=null){const t=POL[S.aterms];return `<div class="au"><div class="box" style="margin:0;border-radius:0;min-height:100vh"><button class="lk" data-aback="1" style="text-align:left">← Back</button><h2>${esc(t[0])}</h2>${t[1].split("\n").map(x=>`<p>${esc(x)}</p>`).join("")}<p class="mut">Draft text. The Local Government legal officer should review it before launch.</p></div></div>`}
 return `<div class="au"><div class="art">${artSvg()}<div class="brand"><span class="mark">✦</span><h1>Safana Connect</h1><p>Residents and the Local Government, together.</p></div></div><div class="box">${authCard()}</div></div>`}
/* Demo preview (no server): everything below lives only in this browser */
const D=()=>S.demoChat||(S.demoChat={room:{locked:false,by:"",at:0,reason:""},pub:[],convs:[],logs:[],pr:0,nid:10});
function syncDemo(){const d=D();HC.room=d.room;HC.pub=d.pub;HC.logs=d.logs;HC.pubUnread=d.pub.filter(m=>m.from!=="me"&&m.id>d.pr).length;
 HC.convs=d.convs.map(c=>{const l=c.msgs[c.msgs.length-1];return{id:c.id,other:c.other,last:l||null,unread:c.msgs.filter(m=>m.from!=="me"&&m.id>c.read).length,iBlocked:c.blocked,theyBlocked:false}});
 d.convs.forEach(c=>HC.msgs[c.id]=c.msgs);HC.up=privUnread()}
/* Server loading */
async function loadState(){const d=await api("GET","/chat/state");HC.room=d.room;HC.pubUnread=d.pubUnread;HC.up=d.privUnread;HC.logs=d.logs||[]}
async function loadConvs(){const d=await api("GET","/chat/conversations");HC.convs=d.conversations.map(c=>{hubUser(c.other);return{id:String(c.id),other:c.other.id,last:c.last,unread:c.unread,iBlocked:c.iBlocked,theyBlocked:c.theyBlocked}});HC.up=privUnread()}
async function hubLoad(){HC.err="";HC.busy=true;render();try{if(S.user)await Promise.all([loadState(),loadConvs()]);else syncDemo()}catch(e){HC.err=e.message}HC.busy=false;badge();render()}
async function openHub(){S.panel=null;S.hub={v:"list"};render();scrollTo(0,0);if(S.apiOn&&!S.user)return;await hubLoad()}
async function hgo(v,id){S.hub={v,id};S.draft="";S.pend=null;render();
 try{if(S.user){if(v==="public")HC.pub=(await api("GET","/chat/public")).messages.map(nm);else HC.msgs[id]=(await api("GET","/chat/conversations/"+id+"/messages")).messages.map(nm)}}catch(e){HC.err=e.message}
 await markRead();render();toBottom()}
async function markRead(){const h=S.hub;if(!h)return;try{
 if(h.v==="public"){if(S.user)await api("POST","/chat/public/read");else D().pr=Math.max(0,...D().pub.map(m=>m.id));HC.pubUnread=0}
 else if(h.v==="conv"){if(S.user){const d=await api("POST","/chat/conversations/"+h.id+"/read");HC.up=d.privUnread}else{const c=D().convs.find(x=>x.id===h.id);if(c)c.read=Math.max(0,...c.msgs.map(m=>m.id))}const c=HC.convs.find(x=>x.id===h.id);if(c)c.unread=0}
 if(!S.user)syncDemo()}catch(e){}badge()}
function connectWS(){if(!S.user||ws)return;try{const w=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/api/ws");ws=w;w.onmessage=ev=>{try{onEvt(JSON.parse(ev.data))}catch(e){}};w.onclose=()=>{if(ws===w)ws=null;if(S.user)setTimeout(connectWS,3000)}}catch(e){}}
function onEvt(e){const v=S.hub;
 if(e.t==="pub"){const m=nm(e.msg);if(!HC.pub.some(x=>x.id===m.id))HC.pub.push(m);if(v&&v.v==="public")markRead();else if(m.from!==myId())HC.pubUnread++}
 else if(e.t==="priv"){const m=nm(e.msg),id=String(e.conv),c=HC.convs.find(x=>x.id===id);if(!c){loadConvs().then(()=>{badge();if(S.hub)render()});return}
  const a=HC.msgs[id]||(HC.msgs[id]=[]);if(!a.some(x=>x.id===m.id))a.push(m);c.last={body:m.body,media:!!m.media,t:m.t};
  if(m.from!==myId()){if(v&&v.v==="conv"&&v.id===id)markRead();else{c.unread++;HC.up++}}}
 else if(e.t==="room"){HC.room=e.room;toast(e.room.locked?"Public chat locked":"Public chat unlocked")}
 badge();if(S.hub){render();toBottom()}}
async function hubSend(){const inp=$("#mi");if(!inp||inp.disabled)return;const t=inp.value.trim(),img=S.pend,h=S.hub;if(!t&&!img)return;
 try{if(S.user){let key="";if(img)key=(await upload(img,h.v==="public"?"public":"private",h.id)).key;
   const m=nm((await api("POST",h.v==="public"?"/chat/public":"/chat/conversations/"+h.id+"/messages",{body:t,media:key})).message);
   if(h.v==="public"){if(!HC.pub.some(x=>x.id===m.id))HC.pub.push(m)}else{const a=HC.msgs[h.id]||(HC.msgs[h.id]=[]);if(!a.some(x=>x.id===m.id))a.push(m);const c=HC.convs.find(x=>x.id===h.id);if(c)c.last={body:m.body,media:!!m.media,t:m.t}}}
  else{const d=D(),m={id:d.nid++,from:"me",body:t,media:img||"",t:Date.now()};
   if(h.v==="public"){if(d.room.locked&&!isStaff())throw new Error("Chat is locked");d.pub.push(m);d.pr=m.id}else{const c=d.convs.find(x=>x.id===h.id);if(c.blocked)throw new Error("Unblock this person to send messages");c.msgs.push(m);c.read=m.id}syncDemo()}
  S.draft="";S.pend=null;render();toBottom()}catch(e){toast(e.message)}}
async function hubLock(lock){const reason=lock?(prompt("Reason for locking (optional)")||"").slice(0,200):"";if(!confirm(lock?"Lock the public chat? Ordinary users will not be able to send messages.":"Unlock the public chat?"))return;
 try{if(S.user){HC.room=(await api("POST","/chat/room",{locked:lock,reason})).room;await loadState()}else{const d=D();d.room={locked:lock,by:ME.name,at:Date.now(),reason};d.logs.unshift({action:lock?"lock":"unlock",by:ME.name,reason,t:Date.now()});syncDemo()}render()}catch(e){toast(e.message)}}
async function hubBlock(oid){const c=HC.convs.find(x=>x.other===oid);if(!c)return;const nb=!c.iBlocked;if(nb&&!confirm("Block this person? They will not be able to message you."))return;
 try{if(S.user)await api("POST","/chat/block",{userId:oid,blocked:nb});else D().convs.find(x=>x.id===c.id).blocked=nb;c.iBlocked=nb;if(!S.user)syncDemo();render();toast(nb?"Blocked":"Unblocked")}catch(e){toast(e.message)}}
async function hubReport(mid){const why=prompt("Why are you reporting this message?");if(why===null)return;
 try{if(S.user)await api("POST","/chat/report",{scope:S.hub.v==="public"?"public":"private",messageId:mid,reason:why});else S.reports.push({id:mid,t:Date.now()});toast("Report sent")}catch(e){toast(e.message)}}
async function startChat(id){if(id==="me"||(S.user&&id===S.user.id))return toast("You cannot message yourself");
 if(S.apiOn&&!S.user){S.hub={v:"list"};render();return}
 if(S.user){if(!sid(id))return toast("This is a sample profile. Chat works with registered accounts.");try{const d=await api("POST","/chat/conversations",{userId:id});await loadConvs();S.hub={v:"list"};await hgo("conv",String(d.id))}catch(e){toast(e.message)}return}
 const d=D();let c=d.convs.find(x=>x.other===id);if(!c){c={id:"c"+d.nid++,other:id,msgs:[],read:0,blocked:false};d.convs.push(c)}syncDemo();S.hub={v:"list"};hgo("conv",c.id)}
const comp=dis=>`<div class="cin" style="padding:8px"><button class="btn sm alt" id="eb" aria-label="Emoji">😊</button><label class="btn sm alt" aria-label="Attach picture">📷<input id="mf" type="file" accept="image/jpeg,image/png,image/webp" hidden></label><input id="mi" maxlength="1000" placeholder="Write a message" aria-label="Message" value="${esc(S.draft||"")}" ${dis?"disabled":""}><button class="btn sm" id="ms" ${dis?"disabled":""}>Send</button></div><div id="emo" hidden class="row" style="padding:0 8px 8px">${EM.map(e=>`<button class="btn sm alt" data-em="${e}">${e}</button>`).join("")}</div>${S.pend?`<div class="row" style="padding:0 12px 8px"><img src="${S.pend}" alt="Attached picture" style="height:48px;border-radius:8px"><button class="btn sm alt" id="mx">Remove</button></div>`:""}`;
function msgHtml(m){const mine=m.from===myId(),u=U(m.from);return `<div class="mg ${mine?"me":""}">${mine?"":`<a href="#" data-prof="${u.id}" aria-label="Open ${esc(u.name)} profile">${av(u)}</a>`}<div class="bub">${mine?"":`<a href="#" data-prof="${u.id}" style="color:inherit;text-decoration:none"><b>${esc(u.name)}</b></a>`}${m.media?`<img class="m" alt="Picture" data-zoom="${esc(m.media)}" src="${esc(m.media)}">`:""}${m.body?`<div>${esc(m.body)}</div>`:""}<div class="mut" style="font-size:12px">${new Date(m.t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}${mine?"":` · <a href="#" data-rep="${m.id}">⚑ Report</a>`}</div></div></div>`}
function hubList(){const pu=HC.pubUnread,lk=HC.room.locked;
 return `<div class="hl"><div class="row" style="padding:12px"><button class="btn alt sm" data-hub="close">← Back</button><h3 class="sp">Chat Hub</h3></div>
 <button class="mi" data-hv="public"><span aria-hidden="true">👥</span><span><b>Public Community Chat</b><div class="mut">${lk?"🔒 Locked":"● Open"}</div></span><span class="sp"></span>${pu?`<span class="cnt">${pu>9?"9+":pu}</span>`:""}</button>
 <div class="mut" style="padding:10px 16px;font-weight:700">Private Chats</div>
 ${HC.busy?'<div class="empty">Loading…</div>':HC.convs.map(c=>{const o=U(c.other);return `<button class="mi" data-hv="c:${c.id}">${av(o)}<span style="min-width:0"><b>${esc(o.name)}</b><div class="mut" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.last?(c.last.media&&!c.last.body?"📷 Photo":c.last.body):"No messages yet")}</div></span><span class="sp"></span><span class="mut">${c.last?ago(c.last.t):""}</span>${c.unread?`<span class="cnt">${c.unread>9?"9+":c.unread}</span>`:""}</button>`}).join("")||'<div class="empty">No private chats yet. Open someone\'s profile and tap Chat.</div>'}</div>`}
function hubRight(){const h=S.hub;
 if(h.v==="list")return `<div class="hv"><div class="empty" style="margin:auto">Choose a chat to start</div></div>`;
 if(h.v==="public"){const lk=HC.room.locked,st=isStaff(),dis=lk&&!st;
  return `<div class="hv"><div class="row" style="padding:10px 12px;border-bottom:1px solid var(--line)"><button class="btn alt sm" data-hub="list" aria-label="Back to chats">←</button><b class="sp">Public Community Chat</b><span class="tag ${lk?"Rejected":""}">${lk?"🔒 Chat Locked":"● Open"}</span>${st?`<button class="btn sm ${lk?"":"red"}" data-lock="${lk?0:1}">${lk?"Unlock":"Lock"} chat</button>`:""}</div>
  ${lk?`<div class="bub" style="margin:8px;background:#fbe3e1"><b>Chat Locked</b><div>Messaging is temporarily disabled${HC.room.by?" by "+esc(HC.room.by):""}. You can still read earlier messages.${st?" As Admin or Chairman you can still send official messages.":""}</div></div>`:""}
  <div class="ml" id="ml">${HC.pub.map(msgHtml).join("")||'<div class="empty">No messages yet.</div>'}</div>${comp(dis)}
  ${st&&HC.logs.length?`<details style="padding:0 12px 10px"><summary>Moderation log</summary>${HC.logs.map(l=>`<div class="mut">${new Date(l.t).toLocaleString()} · ${esc(l.by)} ${l.action==="lock"?"locked":"unlocked"} the chat${l.reason?": "+esc(l.reason):""}</div>`).join("")}</details>`:""}</div>`}
 const c=HC.convs.find(x=>x.id===h.id);if(!c)return `<div class="hv"><div class="empty" style="margin:auto">Conversation not found.</div></div>`;
 const o=U(c.other),off=c.iBlocked||c.theyBlocked;
 return `<div class="hv"><div class="row" style="padding:10px 12px;border-bottom:1px solid var(--line)"><button class="btn alt sm" data-hub="list" aria-label="Back to chats">←</button><a href="#" data-prof="${o.id}" class="row sp" style="color:inherit;text-decoration:none">${av(o)}<b>${esc(o.name)}</b></a><button class="btn alt sm" data-blkc="${o.id}">${c.iBlocked?"Unblock":"Block"}</button></div>
 ${off?`<div class="bub" style="margin:8px;background:#fdf3d0">${c.iBlocked?"You blocked this person. Unblock to send messages.":"You cannot send messages in this chat."}</div>`:""}
 <div class="ml" id="ml">${(HC.msgs[c.id]||[]).map(msgHtml).join("")||'<div class="empty">No messages yet. Say hello.</div>'}</div>${comp(off)}</div>`}
function hubPage(){
 if(S.apiOn&&!S.user)return `<div class="card"><button class="btn alt sm" data-hub="close">← Back</button><h2 style="margin-top:8px">Chat Hub</h2><p class="mut">Log in or register to chat with the community.</p></div>${authCard()}`;
 return `${!S.apiOn?'<div class="bub" style="background:#fdf3d0;margin-bottom:8px">Demo preview: messages are saved only in this browser. They are not secure or private, and other people cannot see them.</div>':""}${HC.err?`<div class="bub" style="background:#fbe3e1;margin-bottom:8px">${esc(HC.err)} <button class="btn sm alt" data-hub="retry">Retry</button></div>`:""}<div class="hub ${S.hub.v==="list"?"vl":"vc"}">${hubList()}${hubRight()}</div>`}
const findU=n=>Object.values(S.users).find(y=>y.user===n.toLowerCase());
const mt=t=>esc(t).replace(/@([a-zA-Z0-9_]{3,30})/g,(m,n)=>{const x=findU(n);return x?`<a href="#" data-prof="${x.id}" style="color:var(--g7);font-weight:700;text-decoration:none">@${n}</a>`:m});
const mentions=(t,ex)=>{(t.match(/@[a-zA-Z0-9_]{3,30}/g)||[]).forEach(m=>{const x=findU(m.slice(1));if(x&&x.id!==ex)ping(x.id,ME.name+" mentioned you in a comment.")})};
const people=q=>{if(!q)return"";const l=Object.values(S.users).filter(u=>u.id!=="me"&&!S.cfg.blocked.includes(u.id)&&!u.suspended&&((u.name+" "+u.user).toLowerCase().includes(q)||(u.email||"").toLowerCase()===q));return l.length?`<div class="card"><h3>People</h3>${l.map(u=>{const f=S.following.has(u.id);return `<div class="row" style="padding:6px 0;border-top:1px solid var(--line)"><a href="#" data-prof="${u.id}" class="row" style="color:inherit;text-decoration:none;flex:1">${av(u)}<span><b>${esc(u.name)}</b><div class="mut">@${esc(u.user)}</div></span></a><button class="fb ${f?"on":""}" data-fol="${u.id}">${f?"Following":"+ Follow"}</button></div>`}).join("")}</div>`:""};
function subPage(){
 if(S.sub==="saved"){const l=[...S.posts,...S.official].filter(p=>S.saved.has(p.id));return `<p class="mut">Only you can see your saved posts. Tap Saved on a post to remove it.</p>${l.map(p=>post(p)).join("")||'<div class="card empty">Nothing saved yet. Tap Save on any post to keep it here.</div>'}`}
 if(S.sub==="edit"){const u=ME;return `<div class="card"><label for="en">Display name</label><input id="en" maxlength="60" value="${esc(u.name)}"><label for="eu">Username</label><input id="eu" maxlength="30" value="${esc(u.user)}"><label for="eb">Bio</label><textarea id="eb" rows="2" maxlength="200">${esc(u.bio)}</textarea><label for="el">Location</label><input id="el" maxlength="80" value="${esc(u.loc||"")}"><label for="ea">Profile picture</label><input id="ea" type="file" data-img="avatar" accept="image/jpeg,image/png,image/webp"><label for="ecv">Cover photo</label><input id="ecv" type="file" data-img="cover" accept="image/jpeg,image/png,image/webp"><div class="row" style="margin-top:10px"><button class="btn" id="sv">Save profile</button><button class="btn alt" id="ec">Cancel</button></div></div>`}
 if(S.sub==="settings")return settingsPage();
 if(S.sub==="help")return `<div class="card"><div class="bub" style="background:#fdf3d0">Support messages and screenshots are deleted automatically 24 hours after they are sent. Only support administrators can read this chat.</div><div id="chat">${chatLive().map(bubble).join("")||'<div class="empty">Send a message to start. An administrator will reply here.</div>'}</div><div class="cin"><input id="hm" maxlength="1000" placeholder="Write a message" aria-label="Message"><button class="btn sm" id="hs">Send</button></div><label for="hf">Screenshot (optional)</label><input id="hf" type="file" accept="image/jpeg,image/png,image/webp"></div>`;
 if(S.sub==="terms"){if(S.pol===null)return `<div class="card" style="padding:0">${POL.map((p,i)=>`<button class="mi" data-pol="${i}">${esc(p[0])}<span class="sp"></span>›</button>`).join("")}</div>`;
